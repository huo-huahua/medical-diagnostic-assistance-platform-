[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    slow: needs the real embedding model or a full app boot (seconds, not ms)
    integration: exercises the whole FastAPI stack through TestClient

# The suite is run with `PYTHONPATH=.` from `backend/`, so `app` is importable.
# `conftest.py` sets DATABASE_URL before `app.core.config` is imported.
