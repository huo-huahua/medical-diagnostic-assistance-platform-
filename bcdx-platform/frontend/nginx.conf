# --------------------------------------------------------------------------- #
# Serves the built SPA and forwards everything that belongs to the backend.
#
# Routing the API through the same origin means the browser never makes a
# cross-origin request, so CORS stops being a deployment concern for the
# browser. (The backend's CORS_ORIGINS still matters for direct API calls.)
# --------------------------------------------------------------------------- #

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any path the app does not own as a file is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (`/api/v1/rag/ask/stream`) must not be buffered. With buffering
        # on, nginx collects the whole response and the "streaming" answer
        # arrives as one lump at the end, which looks like a hang.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /health lives *outside* /api/v1, so the `location /` fallback above would
    # happily answer it with index.html and the JSON consumer would blow up on
    # `res.data.llm`. It needs its own rule.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
